<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>東方幻作伝</title>
    <style>
        body { 
            background-color: #1a1a1a; 
            color: #fff; 
            text-align: center; 
            font-family: 'Courier New', monospace; 
            margin: 0;
            padding-top: 20px;
        }
        h1 { margin: 5px 0 15px 0; font-size: 22px; letter-spacing: 2px; color: #ffccff; }
        #game-container {
            display: inline-flex;
            background-color: #000;
            border: 3px solid #666;
            box-shadow: 0 0 20px rgba(255,100,200,0.3);
        }
        canvas { 
            background-color: #05050f; 
            display: block; 
        }
        #ui-panel {
            width: 180px;
            background-color: #111;
            border-left: 2px solid #444;
            padding: 15px;
            text-align: left;
            box-sizing: border-box;
            font-size: 14px;
        }
        .ui-section {
            margin-bottom: 18px;
        }
        .ui-label {
            color: #aaa;
            font-size: 11px;
            margin-bottom: 2px;
        }
        .ui-value {
            color: #fff;
            font-size: 17px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>東方幻作伝 〜 グレイズ＆アイテム実験場</h1>
    
    <div id="game-container">
        <canvas id="gameCanvas" width="384" height="448"></canvas>
        
        <div id="ui-panel">
            <div class="ui-section">
                <div class="ui-label">SCORE</div>
                <div id="score-val" class="ui-value">00000000</div>
            </div>
            <div class="ui-section">
                <div class="ui-label">GRAZE</div>
                <div id="graze-val" class="ui-value" style="color: #00ffcc;">0</div>
            </div>
            <hr style="border:0; border-top:1px solid #333; margin:12px 0;">
            <div class="ui-section">
                <div class="ui-label">PLAYER</div>
                <div id="lives-val" class="ui-value" style="color: #ff5577;">★★★★★</div>
            </div>
            <div class="ui-section">
                <div class="ui-label">BOMB</div>
                <div id="bombs-val" class="ui-value" style="color: #55aaff;">★★★</div>
            </div>
            <hr style="border:0; border-top:1px solid #333; margin:12px 0;">
            <div class="ui-section">
                <div class="ui-label">POWER</div>
                <div id="power-val" class="ui-value" style="color: #ffff55;">1.00</div>
            </div>
        </div>
    </div>

    <p style="margin-top: 15px; font-size: 13px; color: #ccc;">
        矢印キー：移動 / Shiftキー：低速移動（アイテム自動回収ラインあり！） / Zキー：お札連射
    </p>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let player = { 
            x: canvas.width / 2, 
            y: canvas.height - 60, 
            normalSpeed: 4.5, 
            slowSpeed: 2, 
            radius: 3,
            lives: 5,
            bombs: 3,
            score: 0,
            graze: 0,
            power: 1.00,
            invincible: 0
        };

        let bullets = [];
        let enemyBullets = [];
        let items = []; // 点やPアイテム
        let enemies = [
            { x: 96,  y: 80, radius: 15, hp: 20, shootTimer: 0 },
            { x: 192, y: 60, radius: 15, hp: 20, shootTimer: 25 },
            { x: 288, y: 80, radius: 15, hp: 20, shootTimer: 50 }
        ];
        let keys = {};
        let shootInterval = 0;
        let gameOver = false;

        window.addEventListener('keydown', (e) => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', (e) => keys[e.key.toLowerCase()] = false);

        function resetPlayer() {
            player.x = canvas.width / 2;
            player.y = canvas.height - 60;
            player.invincible = 120;
        }

        // 敵を倒したときにアイテムをばらまく
        function dropItems(x, y) {
            // Pアイテムを2個、点アイテムを3個生成
            for (let i = 0; i < 2; i++) {
                items.push({
                    x: x + (Math.random() - 0.5) * 30,
                    y: y + (Math.random() - 0.5) * 20,
                    vx: (Math.random() - 0.5) * 2,
                    vy: -3 - Math.random() * 2, // 一度上に跳ねる
                    type: 'P'
                });
            }
            for (let i = 0; i < 3; i++) {
                items.push({
                    x: x + (Math.random() - 0.5) * 30,
                    y: y + (Math.random() - 0.5) * 20,
                    vx: (Math.random() - 0.5) * 2,
                    vy: -3 - Math.random() * 2,
                    type: 'point'
                });
            }
        }

        function update() {
            if (gameOver) return;

            if (player.invincible > 0) player.invincible--;

            let currentSpeed = keys['shift'] ? player.slowSpeed : player.normalSpeed;

            if ((keys['arrowleft'] || keys['a']) && player.x > 12) player.x -= currentSpeed;
            if ((keys['arrowright'] || keys['d']) && player.x < canvas.width - 12) player.x += currentSpeed;
            if ((keys['arrowup'] || keys['w']) && player.y > 12) player.y -= currentSpeed;
            if ((keys['arrowdown'] || keys['s']) && player.y < canvas.height - 12) player.y += currentSpeed;

            // Zキーでパワーに応じた本数のお札を発射
            if (keys['z']) {
                shootInterval++;
                let intervalLimit = player.power >= 2.0 ? 4 : 5; // パワーが高いと連射力アップ
                if (shootInterval >= intervalLimit) {
                    let count = player.power >= 2.0 ? 3 : 2; // パワー2.0以上で3wayに！
                    if (count === 2) {
                        let offset = keys['shift'] ? 5 : 10;
                        bullets.push({ x: player.x - offset, y: player.y - 8, speed: 12, angle: -Math.PI / 2 });
                        bullets.push({ x: player.x + offset, y: player.y - 8, speed: 12, angle: -Math.PI / 2 });
                    } else {
                        bullets.push({ x: player.x - 12, y: player.y - 8, speed: 12, angle: -Math.PI / 2 - 0.08 });
                        bullets.push({ x: player.x,      y: player.y - 8, speed: 12, angle: -Math.PI / 2 });
                        bullets.push({ x: player.x + 12, y: player.y - 8, speed: 12, angle: -Math.PI / 2 + 0.08 });
                    }
                    shootInterval = 0;
                }
            } else {
                shootInterval = 0;
            }

            // 自機弾の移動
            for (let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i];
                b.x += Math.cos(b.angle) * b.speed;
                b.y += Math.sin(b.angle) * b.speed;

                if (b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) {
                    bullets.splice(i, 1);
                    continue;
                }

                for (let j = enemies.length - 1; j >= 0; j--) {
                    let e = enemies[j];
                    let dist = Math.hypot(e.x - b.x, e.y - b.y);
                    if (dist < e.radius + 4) {
                        e.hp -= 1;
                        bullets.splice(i, 1);
                        if (e.hp <= 0) {
                            dropItems(e.x, e.y);
                            enemies.splice(j, 1);
                            player.score += 200;
                        }
                        break;
                    }
                }
            }

            // 敵の弾幕発射
            enemies.forEach(e => {
                e.shootTimer++;
                if (e.shootTimer >= 35) {
                    let angle = Math.atan2(player.y - e.y, player.x - e.x);
                    // ちょっと扇状に3way弾を撃たせる
                    enemyBullets.push({ x: e.x, y: e.y, speed: 3.5, angle: angle - 0.15, grazed: false });
                    enemyBullets.push({ x: e.x, y: e.y, speed: 3.5, angle: angle,        grazed: false });
                    enemyBullets.push({ x: e.x, y: e.y, speed: 3.5, angle: angle + 0.15, grazed: false });
                    e.shootTimer = 0;
                }
            });

            // 敵弾の移動、グレイズ判定、被弾判定
            for (let i = enemyBullets.length - 1; i >= 0; i--) {
                let eb = enemyBullets[i];
                eb.x += Math.cos(eb.angle) * eb.speed;
                eb.y += Math.sin(eb.angle) * eb.speed;

                if (eb.x < 0 || eb.x > canvas.width || eb.y < 0 || eb.y > canvas.height) {
                    enemyBullets.splice(i, 1);
                    continue;
                }

                let distToPlayer = Math.hypot(player.x - eb.x, player.y - eb.y);

                // グレイズ判定（当たり判定より外側、かつ一定距離以内かつ、まだ掠っていない弾）
                if (!eb.grazed && distToPlayer < player.radius + 14 && distToPlayer >= player.radius + 3) {
                    player.graze++;
                    player.score += 50; // グレイズボーナス
                    eb.grazed = true;   // 1発につき1回だけグレイズ
                }

                // 被弾判定
                if (player.invincible === 0 && distToPlayer < player.radius + 3) {
                    player.lives--;
                    enemyBullets.splice(i, 1);
                    if (player.lives <= 0) {
                        gameOver = true;
                    } else {
                        resetPlayer();
                    }
                    break;
                }
            }

            // アイテムの移動と回収判定
            for (let i = items.length - 1; i >= 0; i--) {
                let it = items[i];
                it.vy += 0.15; // 重力
                it.x += it.vx;
                it.y += it.vy;

                // 画面下部に落ちたら消す
                if (it.y > canvas.height + 20) {
                    items.splice(i, 1);
                    continue;
                }

                // 自機との距離
                let dist = Math.hypot(player.x - it.x, player.y - it.y);
                // 近づくか、画面上部（アイテム回収ライン）にいるか
                if (dist < 18 || player.y < 80) {
                    // 吸い寄せられる動き
                    let angle = Math.atan2(player.y - it.y, player.x - it.x);
                    it.x += Math.cos(angle) * 7;
                    it.y += Math.sin(angle) * 7;

                    if (dist < 10) {
                        if (it.type === 'P') {
                            player.power = Math.min(4.00, player.power + 0.05);
                        } else {
                            player.score += 1000; // 点アイテムは高得点！
                        }
                        items.splice(i, 1);
                        continue;
                    }
                }
            }

            // 敵が全滅したら復活
            if (enemies.length === 0) {
                player.score += 1000;
                enemies = [
                    { x: 80 + Math.random() * 220,  y: 60 + Math.random() * 40, radius: 15, hp: 20, shootTimer: 0 },
                    { x: 80 + Math.random() * 220,  y: 60 + Math.random() * 40, radius: 15, hp: 20, shootTimer: 15 },
                    { x: 80 + Math.random() * 220,  y: 60 + Math.random() * 40, radius: 15, hp: 20, shootTimer: 30 }
                ];
            }

            // UI更新
            document.getElementById('score-val').innerText = String(player.score).padStart(8, '0');
            document.getElementById('graze-val').innerText = player.graze;
            document.getElementById('lives-val').innerText = gameOver ? 'DEAD' : '★'.repeat(Math.max(0, player.lives));
            document.getElementById('bombs-val').innerText = '★'.repeat(Math.max(0, player.bombs));
            document.getElementById('power-val').innerText = player.power.toFixed(2);
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 敵の描画
            ctx.fillStyle = '#cc44ff';
            enemies.forEach(e => {
                ctx.beginPath();
                ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = 'white';
                ctx.font = '10px sans-serif';
                ctx.fillText(`HP:${e.hp}`, e.x - 12, e.y - 18);
            });

            // アイテムの描画（Pは黄色、点アイテムは青/白）
            items.forEach(it => {
                ctx.beginPath();
                if (it.type === 'P') {
                    ctx.fillStyle = '#ffff00';
                    ctx.arc(it.x, it.y, 6, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#000';
                    ctx.font = 'bold 9px sans-serif';
                    ctx.fillText('P', it.x - 3, it.y + 3);
                } else {
                    ctx.fillStyle = '#00aaff';
                    ctx.arc(it.x, it.y, 5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#fff';
                    ctx.font = 'bold 8px sans-serif';
                    ctx.fillText('点', it.x - 5, it.y + 3);
                }
            });

            // 自機弾の描画
            ctx.fillStyle = '#00ffcc';
            bullets.forEach(b => {
                ctx.save();
                ctx.translate(b.x, b.y);
                ctx.rotate(b.angle + Math.PI / 2);
                ctx.fillRect(-2, -5, 4, 10);
                ctx.restore();
            });

            // 敵の弾（弾幕）の描画
            ctx.fillStyle = '#ff5555';
            enemyBullets.forEach(eb => {
                ctx.beginPath();
                ctx.arc(eb.x, eb.y, 4, 0, Math.PI * 2);
                ctx.fill();
            });

            // 自機の描画
            if (player.invincible === 0 || Math.floor(player.invincible / 4) % 2 === 0) {
                ctx.fillStyle = '#ff3333';
                ctx.beginPath();
                ctx.arc(player.x, player.y, 5, 0, Math.PI * 2);
                ctx.fill();

                if (keys['shift']) {
                    ctx.fillStyle = 'white';
                    ctx.beginPath();
                    ctx.arc(player.x, player.y, 2.5, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // グレイズ判定の範囲（うっすら円を表示）
                    ctx.strokeStyle = 'rgba(0, 255, 255, 0.4)';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.arc(player.x, player.y, 14, 0, Math.PI * 2);
                    ctx.stroke();

                    // 当たり判定のコア
                    ctx.strokeStyle = '#00ffff';
                    ctx.beginPath();
                    ctx.arc(player.x, player.y, 10, 0, Math.PI * 2);
                    ctx.stroke();
                } else {
                    ctx.fillStyle = 'white';
                    ctx.beginPath();
                    ctx.arc(player.x, player.y, 1.5, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // ゲームオーバー表示
            if (gameOver) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = 'red';
                ctx.font = 'bold 28px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2);
                ctx.fillStyle = 'white';
                ctx.font = '14px sans-serif';
                ctx.fillText('F5キーでリトライ', canvas.width / 2, canvas.height / 2 + 30);
                ctx.textAlign = 'left';
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
