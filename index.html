<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>東方幻作伝 〜 立ち絵追加版</title>
    <style>
        body { 
            background-color: #1a1a1a; 
            color: #fff; 
            text-align: center; 
            font-family: 'Courier New', monospace; 
            margin: 0;
            padding-top: 20px;
        }
        h1 { margin: 5px 0 15px 0; font-size: 24px; letter-spacing: 2px; color: #ffccff; }
        #game-container {
            display: inline-flex;
            background-color: #000;
            border: 3px solid #666;
            box-shadow: 0 0 25px rgba(255,100,200,0.4);
        }
        canvas { 
            background-color: #05050f; 
            display: block; 
        }
        #ui-panel {
            width: 200px;
            background-color: #111;
            border-left: 2px solid #444;
            padding: 20px 15px;
            text-align: left;
            box-sizing: border-box;
            font-size: 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .ui-section {
            margin-bottom: 15px;
        }
        .ui-label {
            color: #aaa;
            font-size: 12px;
            margin-bottom: 2px;
        }
        .ui-value {
            color: #fff;
            font-size: 18px;
            font-weight: bold;
        }
        /* 立ち絵表示用エリア */
        #stand-character {
            margin-top: auto;
            text-align: center;
            padding-top: 10px;
        }
        #stand-character img {
            max-width: 100%;
            height: auto;
            max-height: 180px;
            filter: drop-shadow(0 0 8px rgba(255,100,100,0.5));
        }
    </style>
</head>
<body>
    <h1>東方幻作伝 〜 立ち絵追加版</h1>
    
    <div id="game-container">
        <canvas id="gameCanvas" width="640" height="560"></canvas>
        
        <div id="ui-panel">
            <div>
                <div class="ui-section">
                    <div class="ui-label">SCORE</div>
                    <div id="score-val" class="ui-value">00000000</div>
                </div>
                <div class="ui-section">
                    <div class="ui-label">GRAZE</div>
                    <div id="graze-val" class="ui-value" style="color: #00ffcc;">0</div>
                </div>
                <hr style="border:0; border-top:1px solid #333; margin:10px 0;">
                <div class="ui-section">
                    <div class="ui-label">PLAYER</div>
                    <div id="lives-val" class="ui-value" style="color: #ff5577;">★★★★★</div>
                </div>
                <div class="ui-section">
                    <div class="ui-label">BOMB</div>
                    <div id="bombs-val" class="ui-value" style="color: #55aaff;">★★★</div>
                </div>
                <hr style="border:0; border-top:1px solid #333; margin:10px 0;">
                <div class="ui-section">
                    <div class="ui-label">POWER</div>
                    <div id="power-val" class="ui-value" style="color: #ffff55;">1.00</div>
                </div>
            </div>

            <!-- 霊夢の立ち絵表示スペース -->
            <div id="stand-character">
                <img id="reimu-img" src="https://raw.githubusercontent.com/twitter/twemoji/master/assets/72x72/1f38e.png" alt="霊夢立ち絵" onerror="this.style.display='none';">
            </div>
        </div>
    </div>

    <p style="margin-top: 15px; font-size: 13px; color: #ccc;">
        矢印キー：移動 / Shift：低速移動＆オプション合体 / Z：お札＆追尾弾連射
    </p>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // サンプルとしてWikimedia/パブリックドメインのゆっくり霊夢画像を設定
        document.getElementById('reimu-img').src = "https://upload.wikimedia.org/wikipedia/commons/thumb/8/82/Yukkuri_reimu.png/240px-Yukkuri_reimu.png";

        let player = { 
            x: canvas.width / 2, 
            y: canvas.height - 80, 
            normalSpeed: 5, 
            slowSpeed: 2.2, 
            radius: 3,
            lives: 5,
            bombs: 3,
            score: 0,
            graze: 0,
            power: 1.00,
            invincible: 0
        };

        let bullets = [];
        let homingBullets = [];
        let enemyBullets = [];
        let items = [];
        let enemies = [];
        let spawnTimer = 0;
        let keys = {};
        let shootInterval = 0;
        let gameOver = false;

        window.addEventListener('keydown', (e) => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', (e) => keys[e.key.toLowerCase()] = false);

        function resetPlayer() {
            player.x = canvas.width / 2;
            player.y = canvas.height - 80;
            player.invincible = 120;
        }

        function dropItems(x, y) {
            items.push({ x: x, y: y, vx: (Math.random()-0.5)*1.5, vy: -2 - Math.random()*2, type: 'P' });
            items.push({ x: x, y: y, vx: (Math.random()-0.5)*1.5, vy: -2 - Math.random()*2, type: 'point' });
        }

        function getOptionPositions() {
            let positions = [];
            let count = 0;
            if (player.power >= 4.0) count = 4;
            else if (player.power >= 3.0) count = 2;
            else if (player.power >= 2.0) count = 1;

            let isSlow = keys['shift'];
            let dist = isSlow ? 18 : 32;

            if (count === 1) {
                positions.push({ x: player.x, y: player.y - dist });
            } else if (count === 2) {
                positions.push({ x: player.x - dist, y: player.y });
                positions.push({ x: player.x + dist, y: player.y });
            } else if (count === 4) {
                positions.push({ x: player.x - dist, y: player.y });
                positions.push({ x: player.x + dist, y: player.y });
                positions.push({ x: player.x, y: player.y - dist });
                positions.push({ x: player.x, y: player.y + dist });
            }
            return positions;
        }

        function update() {
            if (gameOver) return;

            if (player.invincible > 0) player.invincible--;

            let isSlow = keys['shift'];
            let spd = isSlow ? player.slowSpeed : player.normalSpeed;
            if ((keys['arrowleft'] || keys['a']) && player.x > 12) player.x -= spd;
            if ((keys['arrowright'] || keys['d']) && player.x < canvas.width - 12) player.x += spd;
            if ((keys['arrowup'] || keys['w']) && player.y > 12) player.y -= spd;
            if ((keys['arrowdown'] || keys['s']) && player.y < canvas.height - 12) player.y += spd;

            if (keys['z']) {
                shootInterval++;
                let threshold = isSlow ? 4 : 6;
                if (shootInterval >= threshold) {
                    bullets.push({ x: player.x - 6, y: player.y - 10, vy: -15 });
                    bullets.push({ x: player.x + 6, y: player.y - 10, vy: -15 });

                    let opts = getOptionPositions();
                    opts.forEach(opt => {
                        homingBullets.push({
                            x: opt.x,
                            y: opt.y,
                            vx: 0,
                            vy: -12,
                            speed: 13
                        });
                    });

                    shootInterval = 0;
                }
            } else {
                shootInterval = 0;
            }

            spawnTimer++;
            if (spawnTimer > 50) {
                enemies.push({
                    x: Math.random() * (canvas.width - 80) + 40,
                    y: -10,
                    radius: 14,
                    hp: 6,
                    vx: 0,
                    vy: 1.2,
                    shootTimer: 0
                });
                spawnTimer = 0;
            }

            for (let i = enemies.length - 1; i >= 0; i--) {
                let e = enemies[i];
                e.y += e.vy;

                if (e.y > canvas.height + 20) {
                    enemies.splice(i, 1);
                    continue;
                }

                e.shootTimer++;
                if (e.shootTimer > 110) {
                    let angle = Math.atan2(player.y - e.y, player.x - e.x);
                    enemyBullets.push({
                        x: e.x, y: e.y,
                        vx: Math.cos(angle) * 2.5,
                        vy: Math.sin(angle) * 2.5,
                        grazed: false
                    });
                    e.shootTimer = 0;
                }
            }

            for (let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i];
                b.y += b.vy;
                if (b.y < 0) {
                    bullets.splice(i, 1);
                    continue;
                }

                for (let j = enemies.length - 1; j >= 0; j--) {
                    let e = enemies[j];
                    if (Math.hypot(e.x - b.x, e.y - b.y) < e.radius + 4) {
                        e.hp -= 1;
                        bullets.splice(i, 1);
                        if (e.hp <= 0) {
                            dropItems(e.x, e.y);
                            enemies.splice(j, 1);
                            player.score += 200;
                        }
                        break;
                    }
                }
            }

            for (let i = homingBullets.length - 1; i >= 0; i--) {
                let hb = homingBullets[i];
                let target = null;
                let minDist = 9999;
                enemies.forEach(e => {
                    let d = Math.hypot(e.x - hb.x, e.y - hb.y);
                    if (d < minDist) {
                        minDist = d;
                        target = e;
                    }
                });

                if (target) {
                    let targetAngle = Math.atan2(target.y - hb.y, target.x - hb.x);
                    let currentAngle = Math.atan2(hb.vy, hb.vx);

                    let diff = targetAngle - currentAngle;
                    while (diff < -Math.PI) diff += Math.PI * 2;
                    while (diff > Math.PI) diff -= Math.PI * 2;

                    let newAngle = currentAngle + diff * 0.25;
                    hb.vx = Math.cos(newAngle) * hb.speed;
                    hb.vy = Math.sin(newAngle) * hb.speed;
                }

                hb.x += hb.vx;
                hb.y += hb.vy;

                if (hb.x < -20 || hb.x > canvas.width + 20 || hb.y < -20 || hb.y > canvas.height + 20) {
                    homingBullets.splice(i, 1);
                    continue;
                }

                for (let j = enemies.length - 1; j >= 0; j--) {
                    let e = enemies[j];
                    if (Math.hypot(e.x - hb.x, e.y - hb.y) < e.radius + 5) {
                        e.hp -= 1.2;
                        homingBullets.splice(i, 1);
                        if (e.hp <= 0) {
                            dropItems(e.x, e.y);
                            enemies.splice(j, 1);
                            player.score += 200;
                        }
                        break;
                    }
                }
            }

            for (let i = enemyBullets.length - 1; i >= 0; i--) {
                let eb = enemyBullets[i];
                eb.x += eb.vx;
                eb.y += eb.vy;

                if (eb.x < 0 || eb.x > canvas.width || eb.y < 0 || eb.y > canvas.height) {
                    enemyBullets.splice(i, 1);
                    continue;
                }

                let d = Math.hypot(player.x - eb.x, player.y - eb.y);

                if (!eb.grazed && d < 18 && d >= 4) {
                    player.graze++;
                    player.score += 50;
                    eb.grazed = true;
                }

                if (player.invincible === 0 && d < 4) {
                    player.lives--;
                    enemyBullets.splice(i, 1);
                    if (player.lives <= 0) {
                        gameOver = true;
                    } else {
                        resetPlayer();
                    }
                    break;
                }
            }

            for (let i = items.length - 1; i >= 0; i--) {
                let it = items[i];
                it.vy += 0.03;
                it.x += it.vx;
                it.y += it.vy;

                if (it.y > canvas.height + 20) {
                    items.splice(i, 1);
                    continue;
                }

                let d = Math.hypot(player.x - it.x, player.y - it.y);
                if (player.y < 120 || d < 60) {
                    let angle = Math.atan2(player.y - it.y, player.x - it.x);
                    it.x += Math.cos(angle) * 14;
                    it.y += Math.sin(angle) * 14;
                }

                if (Math.hypot(player.x - it.x, player.y - it.y) < 14) {
                    if (it.type === 'P') {
                        player.power = Math.min(4.00, player.power + 0.10);
                    } else {
                        player.score += 1000;
                    }
                    items.splice(i, 1);
                }
            }

            document.getElementById('score-val').innerText = String(player.score).padStart(8, '0');
            document.getElementById('graze-val').innerText = player.graze;
            document.getElementById('lives-val').innerText = gameOver ? 'DEAD' : '★'.repeat(Math.max(0, player.lives));
            document.getElementById('bombs-val').innerText = '★'.repeat(Math.max(0, player.bombs));
            document.getElementById('power-val').innerText = player.power.toFixed(2);
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = 'rgba(255, 0, 0, 0.3)';
            ctx.setLineDash([4, 4]);
            ctx.beginPath();
            ctx.moveTo(0, 120);
            ctx.lineTo(canvas.width, 120);
            ctx.stroke();
            ctx.setLineDash([]);

            enemies.forEach(e => {
                ctx.fillStyle = '#cc44ff';
                ctx.beginPath();
                ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
                ctx.fill();
            });

            items.forEach(it => {
                ctx.beginPath();
                if (it.type === 'P') {
                    ctx.fillStyle = '#ffff00';
                    ctx.arc(it.x, it.y, 7, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#000';
                    ctx.font = 'bold 10px sans-serif';
                    ctx.fillText('P', it.x - 3, it.y + 3);
                } else {
                    ctx.fillStyle = '#00aaff';
                    ctx.arc(it.x, it.y, 6, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#fff';
                    ctx.font = 'bold 9px sans-serif';
                    ctx.fillText('点', it.x - 5, it.y + 3);
                }
            });

            ctx.fillStyle = '#00ffcc';
            bullets.forEach(b => {
                ctx.fillRect(b.x - 2, b.y - 6, 4, 12);
            });
            homingBullets.forEach(hb => {
                ctx.fillRect(hb.x - 2, hb.y - 6, 4, 12);
            });

            ctx.fillStyle = '#ff5555';
            enemyBullets.forEach(eb => {
                ctx.beginPath();
                ctx.arc(eb.x, eb.y, 5, 0, Math.PI * 2);
                ctx.fill();
            });

            let opts = getOptionPositions();
            opts.forEach(opt => {
                ctx.strokeStyle = '#ff9900';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(opt.x, opt.y, 7, 0, Math.PI * 2);
                ctx.stroke();

                ctx.fillStyle = '#ffff55';
                ctx.beginPath();
                ctx.arc(opt.x, opt.y, 3, 0, Math.PI * 2);
                ctx.fill();
            });

            if (player.invincible === 0 || Math.floor(player.invincible / 4) % 2 === 0) {
                ctx.fillStyle = '#ff3333';
                ctx.beginPath();
                ctx.arc(player.x, player.y, 6, 0, Math.PI * 2);
                ctx.fill();

                if (keys['shift']) {
                    ctx.fillStyle = 'white';
                    ctx.beginPath();
                    ctx.arc(player.x, player.y, 3, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.strokeStyle = '#00ffff';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.arc(player.x, player.y, 12, 0, Math.PI * 2);
                    ctx.stroke();
                } else {
                    ctx.fillStyle = 'white';
                    ctx.beginPath();
                    ctx.arc(player.x, player.y, 2, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            if (gameOver) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = 'red';
                ctx.font = 'bold 32px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2);
                ctx.fillStyle = 'white';
                ctx.font = '16px sans-serif';
                ctx.fillText('F5キーでリトライ', canvas.width / 2, canvas.height / 2 + 35);
                ctx.textAlign = 'left';
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
