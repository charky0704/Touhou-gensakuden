<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>東方幻作伝</title>
    <style>
        body { background-color: #111; color: #fff; text-align: center; font-family: sans-serif; margin-top: 20px; }
        canvas { background-color: #000; display: block; margin: 0 auto; border: 2px solid #555; }
    </style>
</head>
<body>
    <h1>東方幻作伝 〜 Danmaku Prototype</h1>
    <p>矢印キー：移動 / Zキー長押し：連射ショット</p>
    <canvas id="gameCanvas" width="480" height="640"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let player = { x: 240, y: 560, speed: 5, radius: 6 };
        let bullets = [];
        let keys = {};
        let shootInterval = 0; // 連射間隔を調整するタイマー

        window.addEventListener('keydown', (e) => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', (e) => keys[e.key.toLowerCase()] = false);

        function update() {
            // 移動処理
            if ((keys['arrowleft'] || keys['a']) && player.x > 10) player.x -= player.speed;
            if ((keys['arrowright'] || keys['d']) && player.x < canvas.width - 10) player.x += player.speed;
            if ((keys['arrowup'] || keys['w']) && player.y > 10) player.y -= player.speed;
            if ((keys['arrowdown'] || keys['s']) && player.y < canvas.height - 10) player.y += player.speed;

            // Zキーが押されている間、一定間隔で自動連射
            if (keys['z']) {
                shootInterval++;
                if (shootInterval >= 5) { // 数値を小さくすると超連射、大きくすると連射が遅くなる
                    bullets.push({ x: player.x, y: player.y - 10, speed: 10 });
                    shootInterval = 0;
                }
            } else {
                shootInterval = 0; // 離したらリセット
            }

            // 弾の移動と画面外削除
            for (let i = bullets.length - 1; i >= 0; i--) {
                bullets[i].y -= bullets[i].speed;
                if (bullets[i].y < 0) {
                    bullets.splice(i, 1);
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 弾の描画
            ctx.fillStyle = 'yellow';
            bullets.forEach(b => {
                ctx.beginPath();
                ctx.arc(b.x, b.y, 3, 0, Math.PI * 2);
                ctx.fill();
            });

            // 自機の描画
            ctx.fillStyle = 'red';
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.arc(player.x, player.y, 2, 0, Math.PI * 2);
            ctx.fill();
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
