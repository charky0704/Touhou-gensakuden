<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>東方幻作伝</title>
    <style>
        body { 
            background-color: #1a1a1a; 
            color: #fff; 
            text-align: center; 
            font-family: 'Courier New', monospace; 
            margin: 0;
            padding-top: 20px;
        }
        h1 { margin: 5px 0 15px 0; font-size: 22px; letter-spacing: 2px; color: #ffccff; }
        #game-container {
            display: inline-flex;
            background-color: #000;
            border: 3px solid #666;
            box-shadow: 0 0 20px rgba(255,100,200,0.3);
        }
        canvas { 
            background-color: #05050f; 
            display: block; 
        }
        #ui-panel {
            width: 180px;
            background-color: #111;
            border-left: 2px solid #444;
            padding: 15px;
            text-align: left;
            box-sizing: border-box;
            font-size: 14px;
        }
        .ui-section {
            margin-bottom: 20px;
        }
        .ui-label {
            color: #aaa;
            font-size: 11px;
            margin-bottom: 3px;
        }
        .ui-value {
            color: #fff;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>東方幻作伝 〜 弾幕実験場</h1>
    
    <div id="game-container">
        <canvas id="gameCanvas" width="384" height="448"></canvas>
        
        <div id="ui-panel">
            <div class="ui-section">
                <div class="ui-label">SCORE</div>
                <div id="score-val" class="ui-value">00000000</div>
            </div>
            <div class="ui-section">
                <div class="ui-label">HISCORE</div>
                <div class="ui-value">10000000</div>
            </div>
            <hr style="border:0; border-top:1px solid #333; margin:15px 0;">
            <div class="ui-section">
                <div class="ui-label">PLAYER</div>
                <div id="lives-val" class="ui-value" style="color: #ff5577;">★★★★★</div>
            </div>
            <div class="ui-section">
                <div class="ui-label">BOMB</div>
                <div id="bombs-val" class="ui-value" style="color: #55aaff;">★★★</div>
            </div>
            <hr style="border:0; border-top:1px solid #333; margin:15px 0;">
            <div class="ui-section">
                <div class="ui-label">POWER</div>
                <div class="ui-value" style="color: #ffff55;">1.00</div>
            </div>
        </div>
    </div>

    <p style="margin-top: 15px; font-size: 13px; color: #ccc;">
        矢印キー：移動 / Shiftキー：低速移動（コア表示） / Zキー：お札連射
    </p>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let player = { 
            x: canvas.width / 2, 
            y: canvas.height - 60, 
            normalSpeed: 4.5, 
            slowSpeed: 2, 
            radius: 3,       // 当たり判定の半径（コアの小ささ）
            lives: 5,
            bombs: 3,
            score: 0,
            invincible: 0    // 被弾後の無敵時間タイマー
        };

        let bullets = [];
        let enemyBullets = []; // 敵の弾
        let enemies = [
            { x: 96,  y: 80, radius: 15, hp: 15, shootTimer: 0 },
            { x: 192, y: 60, radius: 15, hp: 15, shootTimer: 30 },
            { x: 288, y: 80, radius: 15, hp: 15, shootTimer: 60 }
        ];
        let keys = {};
        let shootInterval = 0;
        let gameOver = false;

        window.addEventListener('keydown', (e) => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', (e) => keys[e.key.toLowerCase()] = false);

        function resetPlayer() {
            player.x = canvas.width / 2;
            player.y = canvas.height - 60;
            player.invincible = 120; // 復活後約2秒間の無敵
        }

        function update() {
            if (gameOver) return;

            // 無敵時間のカウントダウン
            if (player.invincible > 0) {
                player.invincible--;
            }

            let currentSpeed = keys['shift'] ? player.slowSpeed : player.normalSpeed;

            // 移動処理
            if ((keys['arrowleft'] || keys['a']) && player.x > 12) player.x -= currentSpeed;
            if ((keys['arrowright'] || keys['d']) && player.x < canvas.width - 12) player.x += currentSpeed;
            if ((keys['arrowup'] || keys['w']) && player.y > 12) player.y -= currentSpeed;
            if ((keys['arrowdown'] || keys['s']) && player.y < canvas.height - 12) player.y += currentSpeed;

            // Zキーで自機弾の発射
            if (keys['z']) {
                shootInterval++;
                if (shootInterval >= 5) {
                    let offset = keys['shift'] ? 5 : 10;
                    bullets.push({ x: player.x - offset, y: player.y - 8, speed: 12, angle: -Math.PI / 2 });
                    bullets.push({ x: player.x + offset, y: player.y - 8, speed: 12, angle: -Math.PI / 2 });
                    shootInterval = 0;
                }
            } else {
                shootInterval = 0;
            }

            // 自機弾の移動
            for (let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i];
                b.x += Math.cos(b.angle) * b.speed;
                b.y += Math.sin(b.angle) * b.speed;

                if (b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) {
                    bullets.splice(i, 1);
                    continue;
                }

                // 敵との当たり判定
                for (let j = enemies.length - 1; j >= 0; j--) {
                    let e = enemies[j];
                    let dist = Math.hypot(e.x - b.x, e.y - b.y);
                    if (dist < e.radius + 4) {
                        e.hp -= 1;
                        bullets.splice(i, 1);
                        if (e.hp <= 0) {
                            enemies.splice(j, 1);
                            player.score += 100;
                        }
                        break;
                    }
                }
            }

            // 敵の行動と弾幕発射
            enemies.forEach(e => {
                e.shootTimer++;
                // 一定間隔で自機めがけて弾を発射
                if (e.shootTimer >= 40) {
                    let angle = Math.atan2(player.y - e.y, player.x - e.x);
                    enemyBullets.push({ x: e.x, y: e.y, speed: 3.5, angle: angle });
                    e.shootTimer = 0;
                }
            });

            // 敵弾の移動と自機との当たり判定
            for (let i = enemyBullets.length - 1; i >= 0; i--) {
                let eb = enemyBullets[i];
                eb.x += Math.cos(eb.angle) * eb.speed;
                eb.y += Math.sin(eb.angle) * eb.speed;

                if (eb.x < 0 || eb.x > canvas.width || eb.y < 0 || eb.y > canvas.height) {
                    enemyBullets.splice(i, 1);
                    continue;
                }

                // 自機との当たり判定（無敵中でなければミス）
                if (player.invincible === 0) {
                    let dist = Math.hypot(player.x - eb.x, player.y - eb.y);
                    if (dist < player.radius + 3) {
                        // 被弾（ミス）！
                        player.lives--;
                        enemyBullets.splice(i, 1); // 当たった弾を消す
                        if (player.lives <= 0) {
                            gameOver = true;
                        } else {
                            resetPlayer(); // 残機があれば復活して無敵へ
                        }
                        break;
                    }
                }
            }

            // 敵が全滅したら復活
            if (enemies.length === 0) {
                player.score += 500;
                enemies = [
                    { x: 80 + Math.random() * 220,  y: 60 + Math.random() * 40, radius: 15, hp: 15, shootTimer: 0 },
                    { x: 80 + Math.random() * 220,  y: 60 + Math.random() * 40, radius: 15, hp: 15, shootTimer: 20 },
                    { x: 80 + Math.random() * 220,  y: 60 + Math.random() * 40, radius: 15, hp: 15, shootTimer: 40 }
                ];
            }

            // UI更新
            document.getElementById('score-val').innerText = String(player.score).padStart(8, '0');
            document.getElementById('lives-val').innerText = gameOver ? 'DEAD' : '★'.repeat(Math.max(0, player.lives));
            document.getElementById('bombs-val').innerText = '★'.repeat(Math.max(0, player.bombs));
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 敵の描画
            ctx.fillStyle = '#cc44ff';
            enemies.forEach(e => {
                ctx.beginPath();
                ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = 'white';
                ctx.font = '10px sans-serif';
                ctx.fillText(`HP:${e.hp}`, e.x - 12, e.y - 18);
            });

            // 自機弾の描画
            ctx.fillStyle = '#00ffcc';
            bullets.forEach(b => {
                ctx.save();
                ctx.translate(b.x, b.y);
                ctx.rotate(b.angle + Math.PI / 2);
                ctx.fillRect(-2, -5, 4, 10);
                ctx.restore();
            });

            // 敵の弾（弾幕）の描画
            ctx.fillStyle = '#ff5555';
            enemyBullets.forEach(eb => {
                ctx.beginPath();
                ctx.arc(eb.x, eb.y, 4, 0, Math.PI * 2);
                ctx.fill();
            });

            // 自機の描画（無敵中なら点滅）
            if (player.invincible === 0 || Math.floor(player.invincible / 4) % 2 === 0) {
                ctx.fillStyle = '#ff3333';
                ctx.beginPath();
                ctx.arc(player.x, player.y, 5, 0, Math.PI * 2);
                ctx.fill();

                // コア（当たり判定）の描画
                if (keys['shift']) {
                    ctx.fillStyle = 'white';
                    ctx.beginPath();
                    ctx.arc(player.x, player.y, 2.5, 0, Math.PI * 2);
                    ctx.fill();
                    
                    ctx.strokeStyle = '#00ffff';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.arc(player.x, player.y, 10, 0, Math.PI * 2);
                    ctx.stroke();
                } else {
                    ctx.fillStyle = 'white';
                    ctx.beginPath();
                    ctx.arc(player.x, player.y, 1.5, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // ゲームオーバー表示
            if (gameOver) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = 'red';
                ctx.font = 'bold 28px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2);
                ctx.fillStyle = 'white';
                ctx.font = '14px sans-serif';
                ctx.fillText('F5キーでリトライ', canvas.width / 2, canvas.height / 2 + 30);
                ctx.textAlign = 'left'; // 戻す
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
