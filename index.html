<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>東方幻作伝</title>
    <style>
        body {
            background-color: #111;
            color: #fff;
            text-align: center;
            font-family: sans-serif;
            margin-top: 20px;
        }
        canvas {
            background-color: #000;
            display: block;
            margin: 0 auto;
            border: 2px solid #555;
        }
    </style>
</head>
<body>
    <h1>東方幻作伝 〜 Danmaku Prototype</h1>
    <p>矢印キー または WASD：移動</p>
    <canvas id="gameCanvas" width="480" height="640"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // 自機の情報
        let player = {
            x: canvas.width / 2,
            y: canvas.height - 80,
            speed: 4,
            radius: 6,
            color: 'red'
        };

        // キー入力の状態管理
        let keys = {};
        window.addEventListener('keydown', (e) => keys[e.key] = true);
        window.addEventListener('keyup', (e) => keys[e.key] = false);

        // 更新処理
        function update() {
            if ((keys['ArrowLeft'] || keys['a']) && player.x > player.radius) {
                player.x -= player.speed;
            }
            if ((keys['ArrowRight'] || keys['d']) && player.x < canvas.width - player.radius) {
                player.x += player.speed;
            }
            if ((keys['ArrowUp'] || keys['w']) && player.y > player.radius) {
                player.y -= player.speed;
            }つ
            if ((keys['ArrowDown'] || keys['s']) && player.y < canvas.height - player.radius) {
                player.y += player.speed;
            }
        }

        // 描画処理
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 自機の描画（東方風の当たり判定が見える赤い丸）
            ctx.fillStyle = player.color;
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
            ctx.fill();

            // 当たり判定の中心（白い点）
            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.arc(player.x, player.y, 2, 0, Math.PI * 2);
            ctx.fill();
        }

        // メインループ
        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
