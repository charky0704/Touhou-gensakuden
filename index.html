<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>東方幻作伝</title>
    <style>
        body { background-color: #111; color: #fff; text-align: center; font-family: sans-serif; margin-top: 20px; }
        canvas { background-color: #000; display: block; margin: 0 auto; border: 2px solid #555; }
    </style>
</head>
<body>
    <h1>東方幻作伝 〜 霊夢装備実験場</h1>
    <p>矢印キー：移動 / Shiftキー：低速移動 / Zキー：2方向お札連射</p>
    <canvas id="gameCanvas" width="480" height="640"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let player = { x: 240, y: 560, normalSpeed: 5, slowSpeed: 2, radius: 4 };
        let bullets = [];
        let enemies = [
            { x: 120, y: 100, radius: 15, hp: 15 },
            { x: 240, y: 80,  radius: 15, hp: 15 },
            { x: 360, y: 100, radius: 15, hp: 15 }
        ];
        let keys = {};
        let shootInterval = 0;

        window.addEventListener('keydown', (e) => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', (e) => keys[e.key.toLowerCase()] = false);

        function update() {
            // Shiftキーが押されているかでスピードを切り替え（低速移動）
            let currentSpeed = keys['shift'] ? player.slowSpeed : player.normalSpeed;

            // 移動処理
            if ((keys['arrowleft'] || keys['a']) && player.x > 10) player.x -= currentSpeed;
            if ((keys['arrowright'] || keys['d']) && player.x < canvas.width - 10) player.x += currentSpeed;
            if ((keys['arrowup'] || keys['w']) && player.y > 10) player.y -= currentSpeed;
            if ((keys['arrowdown'] || keys['s']) && player.y < canvas.height - 10) player.y += currentSpeed;

            // Zキーで2方向のお札を発射
            if (keys['z']) {
                shootInterval++;
                if (shootInterval >= 5) {
                    // 高速時は少し外側に広がり、低速時は真直ぐ近くを飛ぶような調整も可能
                    let offset = keys['shift'] ? 6 : 12;

                    // 左右2発を同時に生成（真上に向かって発射）
                    bullets.push({ x: player.x - offset, y: player.y - 10, speed: 12, angle: -Math.PI / 2 });
                    bullets.push({ x: player.x + offset, y: player.y - 10, speed: 12, angle: -Math.PI / 2 });
                    
                    shootInterval = 0;
                }
            } else {
                shootInterval = 0;
            }

            // 弾の移動
            for (let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i];
                b.x += Math.cos(b.angle) * b.speed;
                b.y += Math.sin(b.angle) * b.speed;

                // 画面外に出たら消す
                if (b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) {
                    bullets.splice(i, 1);
                    continue;
                }

                // 敵との当たり判定
                for (let j = enemies.length - 1; j >= 0; j--) {
                    let e = enemies[j];
                    let dist = Math.hypot(e.x - b.x, e.y - b.y);
                    if (dist < e.radius + 4) {
                        e.hp -= 1;
                        bullets.splice(i, 1);
                        if (e.hp <= 0) {
                            enemies.splice(j, 1);
                        }
                        break;
                    }
                }
            }

            // 敵が全滅したら復活
            if (enemies.length === 0) {
                enemies = [
                    { x: 100 + Math.random() * 280, y: 80 + Math.random() * 50, radius: 15, hp: 15 },
                    { x: 100 + Math.random() * 280, y: 80 + Math.random() * 50, radius: 15, hp: 15 },
                    { x: 100 + Math.random() * 280, y: 80 + Math.random() * 50, radius: 15, hp: 15 }
                ];
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 敵の描画
            ctx.fillStyle = 'purple';
            enemies.forEach(e => {
                ctx.beginPath();
                ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = 'white';
                ctx.font = '10px sans-serif';
                ctx.fillText(`HP:${e.hp}`, e.x - 12, e.y - 18);
            });

            // お札の描画
            ctx.fillStyle = '#00ffcc';
            bullets.forEach(b => {
                ctx.save();
                ctx.translate(b.x, b.y);
                ctx.rotate(b.angle + Math.PI / 2);
                ctx.fillRect(-3, -6, 6, 12);
                ctx.restore();
            });

            // 自機の描画（Shiftを押すと当たり判定の白い点がハッキリ見える東方仕様）
            ctx.fillStyle = 'red';
            ctx.beginPath();
            ctx.arc(player.x, player.y, 6, 0, Math.PI * 2);
            ctx.fill();

            if (keys['shift']) {
                // 低速移動中は当たり判定（白いコア）を強調
                ctx.fillStyle = 'white';
                ctx.beginPath();
                ctx.arc(player.x, player.y, 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = 'cyan';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.arc(player.x, player.y, player.radius + 3, 0, Math.PI * 2);
                ctx.stroke();
            } else {
                ctx.fillStyle = 'white';
                ctx.beginPath();
                ctx.arc(player.x, player.y, 2, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
