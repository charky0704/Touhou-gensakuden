<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>東方幻作伝 〜 弾幕の極み</title>
    <style>
        body { background-color: #1a1a1a; color: #fff; text-align: center; font-family: 'Courier New', monospace; margin: 0; padding-top: 20px; }
        #game-container { display: inline-flex; background-color: #000; border: 3px solid #666; }
        canvas { background-color: #05050f; display: block; }
        #ui-panel { width: 180px; background-color: #111; border-left: 2px solid #444; padding: 15px; text-align: left; }
        .ui-label { color: #aaa; font-size: 11px; }
        .ui-value { color: #fff; font-size: 17px; font-weight: bold; margin-bottom: 15px; }
    </style>
</head>
<body>
    <h1>東方幻作伝 〜 弾幕実験場</h1>
    <div id="game-container">
        <canvas id="gameCanvas" width="384" height="448"></canvas>
        <div id="ui-panel">
            <div class="ui-label">SCORE</div><div id="score-val" class="ui-value">00000000</div>
            <div class="ui-label">GRAZE</div><div id="graze-val" class="ui-value">0</div>
            <div class="ui-label">PLAYER</div><div id="lives-val" class="ui-value">★★★★★</div>
            <div class="ui-label">POWER</div><div id="power-val" class="ui-value">1.00</div>
        </div>
    </div>
    <p>画面上部に行くとアイテム全回収！</p>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let player = { x: 192, y: 380, normalSpeed: 4.5, slowSpeed: 2, radius: 3, lives: 5, score: 0, graze: 0, power: 1.00, invincible: 0 };
        let bullets = [], enemyBullets = [], items = [], enemies = [{ x: 192, y: 80, radius: 20, hp: 50, shootTimer: 0 }];
        let keys = {}, shootInterval = 0, gameOver = false;

        window.addEventListener('keydown', (e) => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', (e) => keys[e.key.toLowerCase()] = false);

        function update() {
            if (gameOver) return;
            if (player.invincible > 0) player.invincible--;

            let spd = keys['shift'] ? player.slowSpeed : player.normalSpeed;
            if ((keys['arrowleft']||keys['a']) && player.x > 12) player.x -= spd;
            if ((keys['arrowright']||keys['d']) && player.x < canvas.width-12) player.x += spd;
            if ((keys['arrowup']||keys['w']) && player.y > 12) player.y -= spd;
            if ((keys['arrowdown']||keys['s']) && player.y < canvas.height-12) player.y += spd;

            // ショット
            if (keys['z']) {
                shootInterval++;
                if (shootInterval >= 5) {
                    let off = player.power >= 2.0 ? 12 : 8;
                    bullets.push({x: player.x-off, y: player.y-10, vy: -15}, {x: player.x+off, y: player.y-10, vy: -15});
                    if (player.power >= 2.0) bullets.push({x: player.x, y: player.y-10, vy: -15});
                    shootInterval = 0;
                }
            }

            // 弾・アイテム更新
            bullets.forEach((b, i) => { b.y += b.vy; if(b.y < 0) bullets.splice(i, 1); });
            
            // 敵弾幕（スピードアップ）
            enemies.forEach(e => {
                e.shootTimer++;
                if (e.shootTimer > 20) {
                    let angle = Math.atan2(player.y - e.y, player.x - e.x);
                    for(let i=-1; i<=1; i++) {
                        enemyBullets.push({x: e.x, y: e.y, vx: Math.cos(angle+i*0.2)*5, vy: Math.sin(angle+i*0.2)*5, grazed: false});
                    }
                    e.shootTimer = 0;
                }
            });

            enemyBullets.forEach((eb, i) => {
                eb.x += eb.vx; eb.y += eb.vy;
                let d = Math.hypot(player.x-eb.x, player.y-eb.y);
                if (!eb.grazed && d < 15 && d >= 4) { player.graze++; eb.grazed=true; }
                if (player.invincible === 0 && d < 4) { player.lives--; player.invincible=120; player.x=192; player.y=380; }
                if (eb.x < 0 || eb.x > canvas.width || eb.y > canvas.height) enemyBullets.splice(i, 1);
            });

            // アイテム（重力軽減、全回収）
            items.forEach((it, i) => {
                it.vy += 0.05; // 落下をゆっくりに
                it.x += it.vx; it.y += it.vy;
                // 全回収ライン
                if (player.y < 80 || Math.hypot(player.x-it.x, player.y-it.y) < 20) {
                    let angle = Math.atan2(player.y-it.y, player.x-it.x);
                    it.x += Math.cos(angle)*10; it.y += Math.sin(angle)*10;
                }
                if (Math.hypot(player.x-it.x, player.y-it.y) < 10) {
                    if (it.type === 'P') player.power = Math.min(4, player.power+0.1);
                    else player.score += 1000;
                    items.splice(i, 1);
                }
            });

            document.getElementById('score-val').innerText = String(player.score).padStart(8, '0');
            document.getElementById('graze-val').innerText = player.graze;
            document.getElementById('power-val').innerText = player.power.toFixed(2);
        }

        function draw() {
            ctx.clearRect(0,0, canvas.width, canvas.height);
            // 描画処理は省略（前回のコードを流用してください）
            // ※ここから先は描画処理を書いてください
            requestAnimationFrame(()=>{update(); draw();});
        }
        update(); draw();
    </script>
</body>
</html>
