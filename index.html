<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>東方幻作伝 〜 低速収束版</title>
    <style>
        body { background-color: #1a1a1a; color: #fff; text-align: center; font-family: 'Courier New', monospace; margin: 0; padding-top: 20px; }
        h1 { margin: 5px 0 15px 0; font-size: 22px; letter-spacing: 2px; color: #ffccff; }
        #game-container { display: inline-flex; background-color: #000; border: 3px solid #666; box-shadow: 0 0 20px rgba(255,100,200,0.3); }
        canvas { background-color: #05050f; display: block; }
        #ui-panel { width: 180px; background-color: #111; border-left: 2px solid #444; padding: 15px; text-align: left; box-sizing: border-box; font-size: 14px; }
        .ui-section { margin-bottom: 18px; }
        .ui-label { color: #aaa; font-size: 11px; margin-bottom: 2px; }
        .ui-value { color: #fff; font-size: 17px; font-weight: bold; }
    </style>
</head>
<body>
    <h1>東方幻作伝 〜 低速集弾システム搭載</h1>
    <div id="game-container">
        <canvas id="gameCanvas" width="384" height="448"></canvas>
        <div id="ui-panel">
            <div class="ui-section"><div class="ui-label">SCORE</div><div id="score-val" class="ui-value">00000000</div></div>
            <div class="ui-section"><div class="ui-label">GRAZE</div><div id="graze-val" class="ui-value" style="color: #00ffcc;">0</div></div>
            <hr style="border:0; border-top:1px solid #333; margin:12px 0;">
            <div class="ui-section"><div class="ui-label">POWER</div><div id="power-val" class="ui-value" style="color: #ffff55;">1.00</div></div>
        </div>
    </div>
    <p style="margin-top: 15px; font-size: 13px; color: #ccc;">Shiftキー：低速移動で弾が収束！</p>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let player = { x: 192, y: 380, speed: 4.5, slowSpeed: 2, score: 0, graze: 0, power: 1.00, invincible: 0 };
        let bullets = [], enemyBullets = [], items = [], enemies = [{ x: 192, y: 70, radius: 20, hp: 100, shootTimer: 0 }];
        let keys = {}, shootInterval = 0;

        window.addEventListener('keydown', (e) => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', (e) => keys[e.key.toLowerCase()] = false);

        function update() {
            let isSlow = keys['shift'];
            let spd = isSlow ? player.slowSpeed : player.speed;
            if (keys['arrowleft']) player.x -= spd;
            if (keys['arrowright']) player.x += spd;
            if (keys['arrowup']) player.y -= spd;
            if (keys['arrowdown']) player.y += spd;

            // ショット：低速時は間隔短縮＆収束
            if (keys['z']) {
                shootInterval++;
                let threshold = isSlow ? 3 : 6;
                if (shootInterval >= threshold) {
                    let offset = isSlow ? 4 : 12; // 低速時は弾を中央に寄せる
                    bullets.push({ x: player.x - offset, y: player.y - 10, vy: -15 });
                    bullets.push({ x: player.x + offset, y: player.y - 10, vy: -15 });
                    if (!isSlow) bullets.push({ x: player.x, y: player.y - 10, vy: -15 }); // 通常は拡散
                    shootInterval = 0;
                }
            }

            // 弾更新
            bullets.forEach((b, i) => { 
                b.y += b.vy; 
                if(b.y < 0) bullets.splice(i, 1);
            });

            // 敵処理
            enemies.forEach(e => {
                e.shootTimer++;
                if (e.shootTimer > 25) {
                    let angle = Math.atan2(player.y - e.y, player.x - e.x);
                    for (let i = -1; i <= 1; i++) {
                        enemyBullets.push({ x: e.x, y: e.y, vx: Math.cos(angle+i*0.2)*3.0, vy: Math.sin(angle+i*0.2)*3.0 });
                    }
                    e.shootTimer = 0;
                }
            });

            // アイテム回収強化
            items.forEach((it, i) => {
                it.vy += 0.03; it.x += it.vx; it.y += it.vy;
                let dist = Math.hypot(player.x - it.x, player.y - it.y);
                if (player.y < 80 || dist < 40) {
                    let angle = Math.atan2(player.y - it.y, player.x - it.x);
                    it.x += Math.cos(angle) * 15;
                    it.y += Math.sin(angle) * 15;
                }
                if (dist < 10) {
                    if (it.type === 'P') player.power += 0.05;
                    else player.score += 1000;
                    items.splice(i, 1);
                }
            });

            document.getElementById('score-val').innerText = String(player.score).padStart(8, '0');
            document.getElementById('power-val').innerText = player.power.toFixed(2);
        }

        function draw() {
            ctx.clearRect(0,0,canvas.width,canvas.height);
            // 敵・弾・アイテムの描画（省略）
            bullets.forEach(b => { ctx.fillStyle = '#0ff'; ctx.fillRect(b.x-2, b.y-5, 4, 10); });
            enemies.forEach(e => { ctx.fillStyle = '#f0f'; ctx.beginPath(); ctx.arc(e.x, e.y, 20, 0, Math.PI*2); ctx.fill(); });
            
            // 自機：低速時は判定線
            ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(player.x, player.y, 4, 0, Math.PI*2); ctx.fill();
            if(keys['shift']) {
                ctx.strokeStyle = '#0ff'; ctx.beginPath(); ctx.arc(player.x, player.y, 12, 0, Math.PI*2); ctx.stroke();
            }
            requestAnimationFrame(() => { update(); draw(); });
        }
        update(); draw();
        setInterval(() => enemies.length > 0 && items.push({x: enemies[0].x, y: enemies[0].y, vx: (Math.random()-0.5)*2, vy: -1, type: Math.random()>0.5?'P':'point'}), 2000);
    </script>
</body>
</html>
