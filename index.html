<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>東方幻作伝 〜 弾幕調整版</title>
    <style>
        body { background-color: #1a1a1a; color: #fff; text-align: center; font-family: 'Courier New', monospace; margin: 0; padding-top: 20px; }
        #game-container { display: inline-flex; background-color: #000; border: 3px solid #666; box-shadow: 0 0 20px rgba(255,100,200,0.3); }
        canvas { background-color: #05050f; display: block; }
        #ui-panel { width: 180px; background-color: #111; border-left: 2px solid #444; padding: 15px; text-align: left; box-sizing: border-box; font-size: 14px; }
        .ui-section { margin-bottom: 18px; }
        .ui-label { color: #aaa; font-size: 11px; margin-bottom: 2px; }
        .ui-value { color: #fff; font-size: 17px; font-weight: bold; }
    </style>
</head>
<body>
    <h1>東方幻作伝 〜 弾幕調整中</h1>
    <div id="game-container">
        <canvas id="gameCanvas" width="384" height="448"></canvas>
        <div id="ui-panel">
            <div class="ui-section"><div class="ui-label">SCORE</div><div id="score-val" class="ui-value">00000000</div></div>
            <div class="ui-section"><div class="ui-label">GRAZE</div><div id="graze-val" class="ui-value" style="color: #00ffcc;">0</div></div>
            <hr style="border:0; border-top:1px solid #333; margin:12px 0;">
            <div class="ui-section"><div class="ui-label">POWER</div><div id="power-val" class="ui-value" style="color: #ffff55;">1.00</div></div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let player = { x: 192, y: 380, speed: 4.5, slowSpeed: 2, score: 0, graze: 0, power: 1.00, invincible: 0 };
        let bullets = [], enemyBullets = [], items = [], enemies = [{ x: 192, y: 70, radius: 20, hp: 60, timer: 0 }];
        let keys = {};

        window.addEventListener('keydown', (e) => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', (e) => keys[e.key.toLowerCase()] = false);

        function update() {
            // 移動
            let spd = keys['shift'] ? player.slowSpeed : player.speed;
            if (keys['arrowleft']) player.x -= spd;
            if (keys['arrowright']) player.x += spd;
            if (keys['arrowup']) player.y -= spd;
            if (keys['arrowdown']) player.y += spd;

            // 弾幕（速度を少しダウン）
            enemies.forEach(e => {
                e.timer++;
                if (e.timer > 25) { // 間隔を少し開ける
                    let angle = Math.atan2(player.y - e.y, player.x - e.x);
                    for (let i = -1; i <= 1; i++) {
                        enemyBullets.push({ x: e.x, y: e.y, vx: Math.cos(angle+i*0.2)*3.0, vy: Math.sin(angle+i*0.2)*3.0 });
                    }
                    e.timer = 0;
                }
            });

            // 敵弾更新
            enemyBullets.forEach((eb, i) => {
                eb.x += eb.vx; eb.y += eb.vy;
                if (Math.hypot(player.x-eb.x, player.y-eb.y) < 15) player.graze++;
                if (eb.y > canvas.height) enemyBullets.splice(i, 1);
            });

            // アイテム（重力を下げ、引き寄せを強化）
            items.forEach((it, i) => {
                it.vy += 0.03; // 重力を弱く
                it.x += it.vx; it.y += it.vy;
                
                // 引き寄せ（画面上部または接近時）
                let dist = Math.hypot(player.x - it.x, player.y - it.y);
                if (player.y < 80 || dist < 40) {
                    let angle = Math.atan2(player.y - it.y, player.x - it.x);
                    it.x += Math.cos(angle) * 12; // 加速度アップ
                    it.y += Math.sin(angle) * 12;
                }
                
                if (dist < 10) {
                    if (it.type === 'P') player.power += 0.05;
                    else player.score += 1000;
                    items.splice(i, 1);
                }
            });

            document.getElementById('score-val').innerText = String(player.score).padStart(8, '0');
            document.getElementById('graze-val').innerText = player.graze;
            document.getElementById('power-val').innerText = player.power.toFixed(2);
        }

        function draw() {
            ctx.clearRect(0,0,canvas.width,canvas.height);
            // 描画：敵
            ctx.fillStyle = '#cc44ff';
            enemies.forEach(e => ctx.fillRect(e.x-10, e.y-10, 20, 20));
            // 描画：弾
            ctx.fillStyle = '#ff5555';
            enemyBullets.forEach(b => ctx.fillRect(b.x-3, b.y-3, 6, 6));
            // 描画：アイテム
            items.forEach(it => {
                ctx.fillStyle = it.type === 'P' ? '#ff0' : '#0af';
                ctx.fillRect(it.x-5, it.y-5, 10, 10);
            });
            // 描画：自機
            ctx.fillStyle = '#fff';
            ctx.fillRect(player.x-3, player.y-3, 6, 6);
            
            requestAnimationFrame(() => { update(); draw(); });
        }
        update(); draw();
        
        // 仮のアイテム生成（テスト用）
        setInterval(() => items.push({x: Math.random()*384, y: 0, vx: 0, vy: 0, type: Math.random()>0.5?'P':'point'}), 1000);
    </script>
</body>
</html>
