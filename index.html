<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>東方幻作伝</title>
    <style>
        body { 
            background-color: #1a1a1a; 
            color: #fff; 
            text-align: center; 
            font-family: 'Courier New', monospace; 
            margin: 0;
            padding-top: 20px;
            height: 100vh;
            overflow: hidden;
            box-sizing: border-box;
        }
        h1 { margin: 5px 0 15px 0; font-size: 24px; letter-spacing: 2px; color: #ffccff; }
        #game-container {
            display: inline-flex;
            background-color: #000;
            border: 3px solid #666;
            box-shadow: 0 0 25px rgba(255,100,200,0.4);
        }
        canvas { 
            background-color: #05050f; 
            display: block; 
        }
        #ui-panel {
            width: 200px;
            background-color: #111;
            border-left: 2px solid #444;
            padding: 20px 15px;
            text-align: left;
            box-sizing: border-box;
            font-size: 15px;
        }
        .ui-section {
            margin-bottom: 20px;
        }
        .ui-label {
            color: #aaa;
            font-size: 12px;
            margin-bottom: 2px;
        }
        .ui-value {
            color: #fff;
            font-size: 18px;
            font-weight: bold;
        }
        #game-container {
            height: 560px;
            align-items: stretch;
            flex: 0 0 auto;
        }
        #gameCanvas {
            width: 640px;
            height: 560px;
            flex: 0 0 640px;
        }
        #ui-panel {
            width: 200px;
            height: 560px;
            flex: 0 0 200px;
            position: relative;
            overflow: hidden;
        }
        .reimu-portrait {
            position: absolute;
            left: 0;
            bottom: 0;
            width: 100%;
            height: 190px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            overflow: hidden;
            pointer-events: none;
        }
        .reimu-portrait img {
            width: auto;
            height: 190px;
            max-width: 100%;
            object-fit: contain;
            object-position: bottom center;
            display: block;
        }

</style>
</head>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const effectCanvas = document.createElement('canvas');
        effectCanvas.width = canvas.width;
        effectCanvas.height = canvas.height;
        const effectCtx = effectCanvas.getContext('2d');

        let player = { 
            x: canvas.width / 2, 
            y: canvas.height - 80, 
            normalSpeed: 5, 
            slowSpeed: 2.2, 
            radius: 3,
            lives: 5,
            score: 0,
            graze: 0,
            power: 1.00,
            invincible: 0
        };

        let bullets = [];
        let homingBullets = [];
        let enemyBullets = [];
        let items = [];
        let enemies = [];
        let spawnTimer = 0;
        let keys = {};
        let shootInterval = 0;
        let gameOver = false;
        let bombActiveTimer = 0;

// シンプルボス
let boss = null;
let bossDefeated = false;
let bossSpawnTimer = 0;
let bossClearTimer = 0;
let screenShiftX = 0;
let screenShiftTimer = 0;
let bossPhase = 1;
let bossPhaseTransition = 0;
let bossMaxHpPhase2 = 180;

let screenEffect = { timer: 0, duration: 0, offset: 0, angle: 0 };let slashAttack = null;
let slashAttack2 = null;
let slashCooldown = 0;

function pointToSegmentDistance(px, py, x1, y1, x2, y2) {
    const dx = x2 - x1;
    const dy = y2 - y1;
    const len2 = dx * dx + dy * dy;
    if (len2 === 0) return Math.hypot(px - x1, py - y1);
    let u = ((px - x1) * dx + (py - y1) * dy) / len2;
    u = Math.max(0, Math.min(1, u));
    const x = x1 + u * dx;
    const y = y1 + u * dy;
    return Math.hypot(px - x, py - y);
}

function hitBossShield(b) {
    if (!boss) return false;
    const shieldLength = 130;   // 長く
    const shieldWidth = 4;      // 薄く
    const shieldDistance = 78;  // ボスから離す
    const a = boss.shieldAngle;
    const tangentX = Math.cos(a);
    const tangentY = Math.sin(a);
    const normalX = -Math.sin(a);
    const normalY = Math.cos(a);
    const half = shieldLength / 2;

    // 2枚をボスの反対側に配置。板は接線方向に長く伸びる。
    for (const side of [-1, 1]) {
        const cx = boss.x + normalX * shieldDistance * side;
        const cy = boss.y + normalY * shieldDistance * side;
        const x1 = cx - tangentX * half;
        const y1 = cy - tangentY * half;
        const x2 = cx + tangentX * half;
        const y2 = cy + tangentY * half;
        const d = pointToSegmentDistance(b.x, b.y, x1, y1, x2, y2);
        if (d < shieldWidth + 4) {
            // 板の法線方向へ反射。180度反転ではなく、板に当たった面から跳ね返す。
            const dot = b.vx * normalX + b.vy * normalY;
            b.vx -= 2 * dot * normalX;
            b.vy -= 2 * dot * normalY;
            b.x += b.vx * 1.2;
            b.y += b.vy * 1.2;
            return true;
        }
    }
    return false;
}

        window.addEventListener('keydown', (e) => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', (e) => keys[e.key.toLowerCase()] = false);

        function resetPlayer() {
            player.x = canvas.width / 2;
            player.y = canvas.height - 80;
            player.invincible = 120;
        }

        function dropItems(x, y) {
            items.push({ x: x - 6, y: y, vy: 1.8, type: 'P' });
            items.push({ x: x + 6, y: y, vy: 1.8, type: 'point' });
        }

        function getOptionPositions() {
            let positions = [];
            let count = 0;
            if (player.power >= 4.0) count = 4;
            else if (player.power >= 3.0) count = 2;
            else if (player.power >= 2.0) count = 1;

            let isSlow = keys['shift'];
            let dist = isSlow ? 18 : 32;

            if (count === 1) {
                positions.push({ x: player.x, y: player.y - dist });
            } else if (count === 2) {
                positions.push({ x: player.x - dist, y: player.y });
                positions.push({ x: player.x + dist, y: player.y });
            } else if (count === 4) {
                positions.push({ x: player.x - dist, y: player.y });
                positions.push({ x: player.x + dist, y: player.y });
                positions.push({ x: player.x, y: player.y - dist });
                positions.push({ x: player.x, y: player.y + dist });
            }
            return positions;
        }

        function update() {
            if (gameOver) return;

            if (player.invincible > 0) player.invincible--;

            let isSlow = keys['shift'];
            let spd = isSlow ? player.slowSpeed : player.normalSpeed;
            if ((keys['arrowleft'] || keys['a']) && player.x > 12) player.x -= spd;
            if ((keys['arrowright'] || keys['d']) && player.x < canvas.width - 12) player.x += spd;
            if ((keys['arrowup'] || keys['w']) && player.y > 12) player.y -= spd;
            if ((keys['arrowdown'] || keys['s']) && player.y < canvas.height - 12) player.y += spd;

            // ショット処理
            if (keys['z']) {
                shootInterval++;
                let threshold = isSlow ? 4 : 6;
                if (shootInterval >= threshold) {
                    bullets.push({ x: player.x - 6, y: player.y - 10, vy: -15 });
                    bullets.push({ x: player.x + 6, y: player.y - 10, vy: -15 });

                    let opts = getOptionPositions();
                    opts.forEach(opt => {
                        // 発射した瞬間だけ相手を狙い、その後はずっと直進する
                        let target = null;
                        if (boss) {
                            target = boss;
                        } else if (enemies.length > 0) {
                            let minDist = Infinity;
                            for (const e of enemies) {
                                if (e.y < opt.y) {
                                    const d = Math.hypot(e.x - opt.x, e.y - opt.y);
                                    if (d < minDist) {
                                        minDist = d;
                                        target = e;
                                    }
                                }
                            }
                            if (!target) {
                                target = enemies[0];
                            }
                        }

                        let angle = -Math.PI / 2;
                        if (target) {
                            angle = Math.atan2(target.y - opt.y, target.x - opt.x);
                        }

                        homingBullets.push({
                            x: opt.x,
                            y: opt.y,
                            vx: Math.cos(angle) * 7.5,
                            vy: Math.sin(angle) * 7.5,
                            speed: 7.5,
                            locked: true
                        });
                    });

                    shootInterval = 0;
                }
            } else {
                shootInterval = 0;
            }

            // ボム発動処理（パワーを1.00消費）
            if (keys['x'] && player.power >= 1.00 && bombActiveTimer === 0) {
                player.power -= 1.00;
                bombActiveTimer = 90;
            }

            if (bombActiveTimer > 0) {
                bombActiveTimer--;
                enemyBullets = []; // 敵弾全消去
                
                // 画面上の敵すべてに大ダメージ
                enemies.forEach(e => {
                    e.hp -= 0.15;
                });

                if (boss) {
                    boss.hp -= 0.6;
                }

                for (let j = enemies.length - 1; j >= 0; j--) {
                    if (enemies[j].hp <= 0) {
                        dropItems(enemies[j].x, enemies[j].y);
                        enemies.splice(j, 1);
                        player.score += 200;
                    }
                }
                player.invincible = Math.max(player.invincible, 10);
            }

            // ボス登場前だけ通常敵を出現させる
            if (!boss && !bossDefeated) {
                bossSpawnTimer++;
                if (bossSpawnTimer >= 2700) {
                    boss = {
                        x: canvas.width / 2,
                        y: -50,
                        targetY: 85,
                        radius: 28,
                        hp: 180,
                        maxHp: 180,
                        phase: 1,
                        vx: 2.2,
                        shootTimer: 0,
                        moveTimer: 0,
                        shieldAngle: 0
                    };
                    enemyBullets = [];
                    enemies = [];
                }
            }

            // ボス登場前の通常敵
            if (!boss && !bossDefeated) {
                spawnTimer++;
                if (spawnTimer > 60) {
                enemies.push({
                    x: Math.random() * (canvas.width - 80) + 40,
                    y: -10,
                    radius: 8,
                    hp: 6,
                    vy: 1.2,
                    shootTimer: 0
                });
                    spawnTimer = 0;
                }
            }

            if (screenShiftTimer > 0) {
                screenShiftTimer--;
                if (screenShiftTimer === 0) screenShiftX = 0;
            }

            if (screenEffect.timer > 0) {
                screenEffect.timer--;
                let t = screenEffect.timer / screenEffect.duration;
                screenEffect.offset = 48 * Math.sin(t * Math.PI);
            }

            // ボスの移動と攻撃
            if (boss) {
                // 上からゆっくり登場
                if (boss.y < boss.targetY) {
                    boss.y += 1.5;
                } else {
                    boss.moveTimer++;
                    boss.shieldAngle += 0.025;
                    boss.x += boss.vx;

                    if (boss.x < 70 || boss.x > canvas.width - 70) {
                        boss.vx *= -1;
                    }

                    if (bossPhaseTransition > 0) {
                        bossPhaseTransition--;
                    }

                    boss.shootTimer++;

                    // 第二形態：通常の円形弾幕に加えて、2本の切断攻撃を同時発動
                    if (bossPhase === 2 && boss.zureTimer <= 0 && boss.shootTimer >= 95) {
                        boss.zureTimer = 42;
                        boss.secondZureAngle = boss.moveTimer * 0.02;
                        boss.shootTimer = 0;
                    }

                    if (boss.shootTimer >= 48) {
                        // 周囲にゆっくり広がる大きめの弾
                        const count = 18;
                        const baseAngle = boss.moveTimer * 0.025;

                        for (let k = 0; k < count; k++) {
                            let a = baseAngle + (Math.PI * 2 / count) * k;
                            enemyBullets.push({
                                x: boss.x,
                                y: boss.y,
                                vx: Math.cos(a) * 1.55,
                                vy: Math.sin(a) * 1.55,
                                radius: 8,
                                grazed: false
                            });
                        }

                        // 2回に1回は少しずらした追加リング
                        if (Math.floor(boss.moveTimer / 48) % 2 === 0) {
                            for (let k = 0; k < count; k++) {
                                let a = baseAngle + Math.PI / count + (Math.PI * 2 / count) * k;
                                enemyBullets.push({
                                    x: boss.x,
                                    y: boss.y,
                                    vx: Math.cos(a) * 1.15,
                                    vy: Math.sin(a) * 1.15,
                                    radius: 6,
                                    grazed: false
                                });
                            }
                        }

                        boss.shootTimer = 0;
                    }

                    // 空間を「ずらす」大技：斜めの切断線を予告してから攻撃
                    slashCooldown++;
                    if (slashCooldown >= 300) {
                        slashAttack = {
                            timer: 0,
                            duration: 75,
                            angle: boss.moveTimer % 2 === 0 ? -0.48 : 0.48,
                            offset: 0,
                            hit: false
                        };

                        if (bossPhase === 2) {
                            slashAttack2 = {
                                timer: 0,
                                duration: 75,
                                angle: slashAttack.angle + Math.PI / 2,
                                offset: 0,
                                hit: false
                            };
                        }
                        slashCooldown = 0;
                    }
                }
            }

            // 空間切断攻撃の更新
            if (slashAttack) {
                slashAttack.timer++;
                let progress = slashAttack.timer / slashAttack.duration;
                if (slashAttack.timer < 45) {
                    slashAttack.offset = Math.sin(slashAttack.timer * 0.35) * 5;
                } else if (!slashAttack.hit) {
                    slashAttack.hit = true;

                    // 一瞬だけ画面を斜めに「ずらす」
                    screenEffect = {
                        timer: 18,
                        duration: 18,
                        offset: 32,
                        angle: slashAttack.angle
                    };

                    // 画面上の斜め線付近を危険領域にする
                    let px = player.x - canvas.width / 2;
                    let py = player.y - canvas.height / 2;
                    let lineValue = Math.abs(Math.sin(slashAttack.angle) * px - Math.cos(slashAttack.angle) * py);
                    if (lineValue < 18 && player.invincible === 0) {
                        player.lives--;
                        resetPlayer();
                        if (player.lives <= 0) gameOver = true;
                    }
                    // 能力の反動
                    boss.hp -= 8;
                }
                if (slashAttack.timer >= slashAttack.duration) slashAttack = null;
            }


            // 第二形態の同時切断攻撃
            if (slashAttack2) {
                slashAttack2.timer++;
                if (slashAttack2.timer >= 45 && !slashAttack2.hit) {
                    slashAttack2.hit = true;
                    let px2 = player.x - canvas.width / 2;
                    let py2 = player.y - canvas.height / 2;
                    let lineValue2 = Math.abs(
                        Math.sin(slashAttack2.angle) * px2 -
                        Math.cos(slashAttack2.angle) * py2
                    );
                    if (lineValue2 < 18 && player.invincible === 0) {
                        player.lives--;
                        resetPlayer();
                        if (player.lives <= 0) gameOver = true;
                    }
                    if (boss) boss.hp = Math.max(0, boss.hp - 8);
                }
                if (slashAttack2.timer >= slashAttack2.duration) slashAttack2 = null;
            }

            // 敵の移動と攻撃
            for (let i = enemies.length - 1; i >= 0; i--) {
                let e = enemies[i];
                e.y += e.vy;

                if (e.y > canvas.height + 20) {
                    enemies.splice(i, 1);
                    continue;
                }

                // 敵本体と自機の当たり判定（追加部分）
                let distToEnemy = Math.hypot(player.x - e.x, player.y - e.y);
                if (player.invincible === 0 && distToEnemy < e.radius + player.radius) {
                    player.lives--;
                    enemies.splice(i, 1);
                    if (player.lives <= 0) {
                        gameOver = true;
                    } else {
                        resetPlayer();
                    }
                    continue;
                }

                e.shootTimer++;
                if (e.shootTimer > 180) {
                    let angle = Math.atan2(player.y - e.y, player.x - e.x);
                    enemyBullets.push({
                        x: e.x, y: e.y,
                        vx: Math.cos(angle) * 2.5,
                        vy: Math.sin(angle) * 2.5,
                        grazed: false
                    });
                    e.shootTimer = 0;
                }
            }

            // 自機通常弾
            for (let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i];
                b.y += b.vy;
                if (b.y < 0) {
                    bullets.splice(i, 1);
                    continue;
                }

                if (boss && hitBossShield(b)) {
                    bullets.splice(i, 1);
                    continue;
                }

                for (let j = enemies.length - 1; j >= 0; j--) {
                    let e = enemies[j];
                    if (Math.hypot(e.x - b.x, e.y - b.y) < e.radius + 4) {
                        e.hp -= 1;
                        bullets.splice(i, 1);
                        if (e.hp <= 0) {
                            dropItems(e.x, e.y);
                            enemies.splice(j, 1);
                            player.score += 200;
                        }
                        break;
                    }
                }
            }

            // 追尾弾
            for (let i = homingBullets.length - 1; i >= 0; i--) {
                let hb = homingBullets[i];

                hb.x += hb.vx;
                hb.y += hb.vy;

                if (hb.x < -20 || hb.x > canvas.width + 20 || hb.y < -20 || hb.y > canvas.height + 20) {
                    homingBullets.splice(i, 1);
                    continue;
                }

                if (boss && hitBossShield(hb)) {
                    continue;
                }

                for (let j = enemies.length - 1; j >= 0; j--) {
                    let e = enemies[j];
                    if (Math.hypot(e.x - hb.x, e.y - hb.y) < e.radius + 5) {
                        e.hp -= 0.35;
                        homingBullets.splice(i, 1);
                        if (e.hp <= 0) {
                            dropItems(e.x, e.y);
                            enemies.splice(j, 1);
                            player.score += 200;
                        }
                        break;
                    }
                }
            }

            // ボスへの通常弾・追尾弾の当たり判定
            if (boss) {
                for (let i = bullets.length - 1; i >= 0; i--) {
                    let b = bullets[i];
                    if (Math.hypot(boss.x - b.x, boss.y - b.y) < boss.radius + 5) {
                        boss.hp -= 1;
                        bullets.splice(i, 1);
                    }
                }

                for (let i = homingBullets.length - 1; i >= 0; i--) {
                    let hb = homingBullets[i];
                    if (Math.hypot(boss.x - hb.x, boss.y - hb.y) < boss.radius + 6) {
                        boss.hp -= 0.35;
                        homingBullets.splice(i, 1);
                    }
                }

                if (boss.hp <= 0) {
                    if (bossPhase === 1) {
                        // 第一形態撃破 → 第二形態へ回復して移行
                        bossPhase = 2;
                        boss.phase = 2;
                        boss.maxHp = bossMaxHpPhase2;
                        boss.hp = boss.maxHp;
                        bossPhaseTransition = 120;
                        boss.zureTimer = 0;
                        boss.shootTimer = 0;
                        slashAttack = null;
                        slashAttack2 = null;
                        enemyBullets.length = 0;
                    } else {
                        boss.hp = 0;
                        bossDefeated = true;
                        boss = null;
                    }
                }
            }

            // 敵弾処理
            for (let i = enemyBullets.length - 1; i >= 0; i--) {
                let eb = enemyBullets[i];
                let ebRadius = eb.radius || 5;
                eb.x += eb.vx;
                eb.y += eb.vy;

                if (eb.x < 0 || eb.x > canvas.width || eb.y < 0 || eb.y > canvas.height) {
                    enemyBullets.splice(i, 1);
                    continue;
                }

                let d = Math.hypot(player.x - eb.x, player.y - eb.y);

                if (!eb.grazed && d < ebRadius + 14 && d >= ebRadius - 1) {
                    player.graze++;
                    player.score += 50;
                    eb.grazed = true;
                }

                if (player.invincible === 0 && d < ebRadius - 1) {
                    player.lives--;
                    enemyBullets.splice(i, 1);
                    if (player.lives <= 0) {
                        gameOver = true;
                    } else {
                        resetPlayer();
                    }
                    break;
                }
            }

            // アイテム処理
            for (let i = items.length - 1; i >= 0; i--) {
                let it = items[i];

                if (player.y <= 120) {
                    let angle = Math.atan2(player.y - it.y, player.x - it.x);
                    it.x += Math.cos(angle) * 16;
                    it.y += Math.sin(angle) * 16;
                } else {
                    it.y += it.vy;
                }

                if (it.y > canvas.height + 20) {
                    items.splice(i, 1);
                    continue;
                }

                if (Math.hypot(player.x - it.x, player.y - it.y) < 18) {
                    if (it.type === 'P') {
                        player.power = Math.min(4.00, player.power + 0.10);
                    } else {
                        player.score += 1000;
                    }
                    items.splice(i, 1);
                }
            }

            if (bossClearTimer > 0) bossClearTimer--;

            // UI更新
            document.getElementById('score-val').innerText = String(player.score).padStart(8, '0');
            document.getElementById('graze-val').innerText = player.graze;
            document.getElementById('lives-val').innerText = gameOver ? 'DEAD' : '★'.repeat(Math.max(0, player.lives));
            document.getElementById('power-val').innerText = player.power.toFixed(2);

            let bossHpBar = document.getElementById('boss-hp-val');
            if (bossHpBar) {
                bossHpBar.innerText = boss
                    ? `${Math.max(0, Math.ceil(boss.hp))} / ${boss.maxHp}`
                    : (bossDefeated ? 'DEFEATED' : '---');
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 空間切断演出：画面を上下の帯に分け、中央の切断線を境に片側だけ横へずらす
            if (screenShiftX !== 0) {
                ctx.save();

                // 下側をずらして描画するためのクリップ
                ctx.beginPath();
                ctx.rect(0, canvas.height * 0.48, canvas.width, canvas.height * 0.52);
                ctx.clip();
                ctx.translate(screenShiftX, 0);
            }

            // 回収ライン
            ctx.strokeStyle = 'rgba(255, 0, 0, 0.3)';
            ctx.setLineDash([4, 4]);
            ctx.beginPath();
            ctx.moveTo(0, 120);
            ctx.lineTo(canvas.width, 120);
            ctx.stroke();
            ctx.setLineDash([]);

            // 敵描画
            enemies.forEach(e => {
                ctx.fillStyle = '#cc44ff';
                ctx.beginPath();
                ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
                ctx.fill();
            });

            // アイテム描画
            items.forEach(it => {
                ctx.beginPath();
                if (it.type === 'P') {
                    ctx.fillStyle = '#ffff00';
                    ctx.arc(it.x, it.y, 7, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#000';
                    ctx.font = 'bold 10px sans-serif';
                    ctx.fillText('P', it.x - 3, it.y + 3);
                } else {
                    ctx.fillStyle = '#00aaff';
                    ctx.arc(it.x, it.y, 6, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#fff';
                    ctx.font = 'bold 9px sans-serif';
                    ctx.fillText('点', it.x - 5, it.y + 3);
                }
            });

            // 自機通常弾描画
            ctx.fillStyle = '#00ffcc';
            bullets.forEach(b => {
                ctx.fillRect(b.x - 2, b.y - 6, 4, 12);
            });

            // 追尾弾描画
            homingBullets.forEach(hb => {
                let angle = Math.atan2(hb.vy, hb.vx);
                ctx.save();
                ctx.translate(hb.x, hb.y);
                ctx.rotate(angle + Math.PI / 2);
                ctx.fillStyle = '#00ffcc';
                ctx.fillRect(-2, -6, 4, 12);
                ctx.restore();
            });

            // 敵弾描画
            ctx.fillStyle = '#ff5555';
            enemyBullets.forEach(eb => {
                let r = eb.radius || 5;
                ctx.beginPath();
                ctx.arc(eb.x, eb.y, r, 0, Math.PI * 2);
                ctx.fill();
            });

            // オプション描画
            let opts = getOptionPositions();
            opts.forEach(opt => {
                ctx.strokeStyle = '#ff9900';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(opt.x, opt.y, 7, 0, Math.PI * 2);
                ctx.stroke();

                ctx.fillStyle = '#ffff55';
                ctx.beginPath();
                ctx.arc(opt.x, opt.y, 3, 0, Math.PI * 2);
                ctx.fill();
            });

            // 自機描画
            if (player.invincible === 0 || Math.floor(player.invincible / 4) % 2 === 0) {
                ctx.fillStyle = '#ff3333';
                ctx.beginPath();
                ctx.arc(player.x, player.y, 6, 0, Math.PI * 2);
                ctx.fill();

                if (keys['shift']) {
                    ctx.fillStyle = 'white';
                    ctx.beginPath();
                    ctx.arc(player.x, player.y, 3, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.strokeStyle = '#00ffff';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.arc(player.x, player.y, 12, 0, Math.PI * 2);
                    ctx.stroke();
                } else {
                    ctx.fillStyle = 'white';
                    ctx.beginPath();
                    ctx.arc(player.x, player.y, 2, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // ボム描画エフェクト
            if (bombActiveTimer > 0) {
                let radius = (90 - bombActiveTimer) * 12;
                ctx.fillStyle = 'rgba(100, 200, 255, 0.25)';
                ctx.beginPath();
                ctx.arc(player.x, player.y, radius, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(player.x, player.y, radius, 0, Math.PI * 2);
                ctx.stroke();
            }

            // 「ずらす」空間切断の演出
            if (slashAttack) {
                ctx.save();
                let a = slashAttack.angle;
                let cx = canvas.width / 2;
                let cy = canvas.height / 2;
                let len = Math.hypot(canvas.width, canvas.height) * 0.8;
                let dx = Math.cos(a) * len;
                let dy = Math.sin(a) * len;
                let x1 = cx - dx, y1 = cy - dy;
                let x2 = cx + dx, y2 = cy + dy;

                // 亀裂の予告線
                let warning = slashAttack.timer < 45;
                ctx.lineWidth = warning ? 3 : 10;
                ctx.strokeStyle = warning ? 'rgba(255,255,255,0.75)' : 'rgba(255,80,180,0.95)';
                ctx.shadowBlur = warning ? 8 : 22;
                ctx.shadowColor = '#ff55bb';
                ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();

                if (!warning) {
                    // 線の両側を少しずらして見せる
                    ctx.globalAlpha = 0.22;
                    ctx.translate(slashAttack.offset * Math.cos(a + Math.PI/2), slashAttack.offset * Math.sin(a + Math.PI/2));
                    ctx.fillStyle = '#ff44aa';
                    ctx.fillRect(0,0,canvas.width,canvas.height);
                }
                ctx.restore();
            }


            // second slash visual
            if (slashAttack2 && slashAttack2.timer < slashAttack2.duration) {
                ctx.save();
                ctx.translate(canvas.width / 2, canvas.height / 2);
                ctx.rotate(slashAttack2.angle);
                ctx.strokeStyle = 'rgba(190,235,255,0.9)';
                ctx.shadowColor = '#cceeff';
                ctx.shadowBlur = 12;
                ctx.lineWidth = slashAttack2.timer >= 35 ? 4 : 2;
                ctx.beginPath();
                ctx.moveTo(-900, 0);
                ctx.lineTo(900, 0);
                ctx.stroke();
                ctx.restore();
            }

            // ボス描画
            if (boss) {
                ctx.save();

                // ボスを囲う円形HPゲージ
                let hpRatio = Math.max(0, boss.hp / boss.maxHp);
                let ringRadius = boss.radius + 13;

                ctx.lineWidth = 6;
                ctx.strokeStyle = '#3a183a';
                ctx.beginPath();
                ctx.arc(boss.x, boss.y, ringRadius, 0, Math.PI * 2);
                ctx.stroke();

                ctx.strokeStyle = bossPhase === 2 ? '#ff8844' : '#ff44cc';
                ctx.beginPath();
                ctx.arc(
                    boss.x,
                    boss.y,
                    ringRadius,
                    -Math.PI / 2,
                    -Math.PI / 2 + Math.PI * 2 * hpRatio
                );
                ctx.stroke();

                // ボスを守る2枚の薄く長い回転板
                ctx.save();
                ctx.translate(boss.x, boss.y);
                ctx.rotate(boss.shieldAngle);
                const shieldDistance = 78;
                const shieldLength = 130;
                for (const side of [-1, 1]) {
                    ctx.save();
                    // 回転角に対して垂直方向へ離す
                    ctx.translate(0, side * shieldDistance);
                    ctx.fillStyle = 'rgba(90, 180, 255, 0.9)';
                    ctx.shadowColor = '#66ccff';
                    ctx.shadowBlur = 10;
                    ctx.fillRect(-shieldLength / 2, -3, shieldLength, 6);
                    ctx.shadowBlur = 0;
                    ctx.strokeStyle = '#dff8ff';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(-shieldLength / 2, -3, shieldLength, 6);
                    ctx.restore();
                }
                ctx.restore();

                if (bossPhase === 2) {
                ctx.save();
                ctx.fillStyle = '#ff8844';
                ctx.font = 'bold 14px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('PHASE 2', boss.x, boss.y - boss.radius - 24);
                ctx.restore();
            }

            // ボス本体
                ctx.fillStyle = '#dd55ff';
                ctx.beginPath();
                ctx.arc(boss.x, boss.y, boss.radius, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = '#ffccff';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(boss.x, boss.y, boss.radius + 6, 0, Math.PI * 2);
                ctx.stroke();

                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(boss.x - 9, boss.y - 5, 4, 0, Math.PI * 2);
                ctx.arc(boss.x + 9, boss.y - 5, 4, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }

            if (bossClearTimer > 0 && !gameOver) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 32px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('BOSS DEFEATED!', canvas.width / 2, canvas.height / 2);
                ctx.textAlign = 'left';
            }

            // ゲームオーバー画面
            if (gameOver) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = 'red';
                ctx.font = 'bold 32px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2);
                ctx.fillStyle = 'white';
                ctx.font = '16px sans-serif';
                ctx.fillText('F5キーでリトライ', canvas.width / 2, canvas.height / 2 + 35);
                ctx.textAlign = 'left';
            }

            // 「ずらす」演出：切断線に対して垂直方向へ、左右の画面片を逆方向にずらす
            if (screenEffect.timer > 0) {
                // まず現在の完成画面を保存
                effectCtx.clearRect(0, 0, canvas.width, canvas.height);
                effectCtx.drawImage(canvas, 0, 0);

                const a = screenEffect.angle;
                const dx = Math.cos(a);          // 切断線の方向
                const dy = Math.sin(a);
                const nx = -dy;                  // 切断線に対して垂直な方向
                const ny = dx;
                const cx = canvas.width / 2;
                const cy = canvas.height / 2;
                const L = 2000;
                const off = screenEffect.offset;

                // 画面を完全に描き直す
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                // 切断線の片側（+normal）を、切断方向へ押し出す
                ctx.save();
                ctx.beginPath();
                ctx.moveTo(cx - dx * L, cy - dy * L);
                ctx.lineTo(cx + dx * L, cy + dy * L);
                ctx.lineTo(cx + dx * L + nx * L, cy + dy * L + ny * L);
                ctx.lineTo(cx - dx * L + nx * L, cy - dy * L + ny * L);
                ctx.closePath();
                ctx.clip();
                ctx.drawImage(effectCanvas, nx * off, ny * off);
                ctx.restore();

                // 反対側も逆方向へ押し出す
                ctx.save();
                ctx.beginPath();
                ctx.moveTo(cx - dx * L, cy - dy * L);
                ctx.lineTo(cx + dx * L, cy + dy * L);
                ctx.lineTo(cx + dx * L - nx * L, cy + dy * L - ny * L);
                ctx.lineTo(cx - dx * L - nx * L, cy - dy * L - ny * L);
                ctx.closePath();
                ctx.clip();
                ctx.drawImage(effectCanvas, -nx * off, -ny * off);
                ctx.restore();

                // 切断線を発光させる
                ctx.save();
                ctx.strokeStyle = 'rgba(235,245,255,0.98)';
                ctx.shadowColor = '#7ddcff';
                ctx.shadowBlur = 20;
                ctx.lineWidth = 5;
                ctx.beginPath();
                ctx.moveTo(cx - dx * L, cy - dy * L);
                ctx.lineTo(cx + dx * L, cy + dy * L);
                ctx.stroke();

                ctx.shadowBlur = 0;
                ctx.strokeStyle = 'rgba(255,255,255,0.9)';
                ctx.lineWidth = 1.5;
                ctx.stroke();
                ctx.restore();
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    
        function resetPlayerAfterZure() {
            player.x = playerStartX;
            player.y = playerStartY;
        }

</script>
